tool_result_shapes:
    package_extension:
        command: "pnpm package"
        source: "apps/extension/package.ts"
        output_path: "apps/extension/dist/live-connector-3.1.0.ablx"
        archive_contents:
            - "manifest.json"
            - "dist/extension.js"
    do_read:
        statuses:
            - status: "ok"
              fields:
                  count: "number"
                  rows: "Row[]"
                  truncated: "boolean"
                  hint: "string | undefined"
    do_write:
        statuses:
            - status: "no_match"
              fields:
                  matched: "0"
                  hint: "string"
            - status: "preview"
              fields:
                  matched: "number"
                  plan: "object"
            - status: "confirm_required"
              fields:
                  undoable: "UndoableLevel"
                  undoableReason: "string | undefined"
                  plan: "object"
            - status: "ok"
              fields:
                  writeId: "string"
                  undoable: "UndoableLevel"
                  changed: "ChangedEntry[] | undefined"
                  created: "object[] | undefined"
                  deleted: "object[] | undefined"
                  copied: "object[] | undefined"
    undo:
        statuses:
            - status: "no_match"
              fields:
                  hint: "string"
            - status: "ok"
              fields:
                  undone: "UndoResultEntry[]"
    render:
        statuses:
            - status: "ok"
              fields:
                  filePath: "string"
                  source: "\"audio-track-pre-fx\""
                  method: "\"sdk-pre-fx\""
                  startTime: "number"
                  endTime: "number"
                  duration: "number"
                  track: "{ index, name, kind: \"audio\" }"
            - status: "started"
              fields:
                  jobId: "string"
                  source: "RenderSource"
                  method: "RenderMethod"
                  track: "{ index, name, kind: \"audio\" } | undefined"
                  startTime: "number"
                  endTime: "number"
                  duration: "number"
                  hint: "string"
            - status: "preview"
              fields:
                  planId: "string"
                  source: "\"main\""
                  method: "\"realtime-resampling\""
                  timeUnit: "\"quarter-note-beats\""
                  range: "{ startTime, endTime }"
                  effects: "string[]"
                  requiresConfirmation: "true"
                  limits: "{ maxCaptureBeats, maxArtifactBytes }"
                  warnings: "string[]"
            - status: "confirm_required"
              fields:
                  source: "\"main\""
                  planId: "string"
                  requestId: "string"
                  requiresConfirmation: "true"
    do_call:
        statuses:
            - status: "preview"
              fields:
                  operation: "string"
                  effect: "\"runtime\""
                  undoable: "\"none\""
                  requiresConfirmation: "true"
                  args: "ProcedureArgument[]"
            - status: "confirm_required"
              fields:
                  operation: "string"
                  effect: "\"runtime\""
                  undoable: "\"none\""
            - status: "ok"
              fields:
                  operation: "string"
                  effect: "\"runtime\""
                  undoable: "\"none\""
                  verified: "boolean"
                  jobId: "string | undefined（render.cancel）"
                  jobStatus: "string | undefined（render.cancel）"
                  cancelAccepted: "boolean | undefined（render.cancel）"
            - status: "error"
              fields:
                  error: "HybridErrorCode | string"
                  detail: "string"
                  hint: "string | undefined"
lom_graph:
    source: "packages/lom-schema/src/schema.ts"
    version: "1.0.0"
    startable_labels:
        source: "apps/extension/src/lom/adapter.ts"
        labels:
            - "Song"
            - "Track"
            - "MidiTrack"
            - "AudioTrack"
            - "ReturnTrack"
            - "MainTrack"
            - "Clip"
            - "MidiClip"
            - "AudioClip"
            - "Device"
            - "RackDevice"
            - "DrumRack"
            - "Simpler"
            - "Scene"
            - "CuePoint"
            - "WriteEvent"
            - "RenderJob"
            - "Transport"
    labels:
        - label: "Song"
          description: "Live Set のルート。"
          properties:
              - { name: "tempo", type: "number", access: "rw" }
              - { name: "scaleMode", type: "boolean", access: "r" }
              - { name: "scaleName", type: "string", access: "r" }
              - { name: "rootNote", type: "number", access: "r", description: "0(C)-11(B)" }
              - { name: "scaleIntervals", type: "number[]", access: "r" }
              - { name: "gridQuantization", type: "enum", access: "r", enum: "grid_quantization" }
              - { name: "gridIsTriplet", type: "boolean", access: "r" }
        - label: "Track"
          abstract: true
          description: "MidiTrack / AudioTrack / ReturnTrack / MainTrack の抽象基底。"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "rw" }
              - { name: "kind", type: "string", access: "r", description: "midi/audio/return/main" }
              - { name: "arm", type: "boolean", access: "rw" }
              - { name: "mute", type: "boolean", access: "rw" }
              - { name: "solo", type: "boolean", access: "rw" }
              - { name: "mutedViaSolo", type: "boolean", access: "r" }
        - label: "MidiTrack"
          extends: "Track"
          properties: []
        - label: "AudioTrack"
          extends: "Track"
          properties: []
        - label: "ReturnTrack"
          extends: "Track"
          properties: []
        - label: "MainTrack"
          extends: "Track"
          properties: []
        - label: "Mixer"
          description: "トラックのミキサー。volume / panning / sends を Parameter として持つ。"
          properties: []
        - label: "Clip"
          abstract: true
          description: "MidiClip / AudioClip の抽象基底。"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "rw" }
              - { name: "color", type: "number", access: "rw" }
              - { name: "muted", type: "boolean", access: "rw" }
              - { name: "looping", type: "boolean", access: "rw" }
              - { name: "loopStart", type: "number", access: "r" }
              - { name: "loopEnd", type: "number", access: "r" }
              - { name: "startMarker", type: "number", access: "r" }
              - { name: "endMarker", type: "number", access: "r" }
              - { name: "startTime", type: "number", access: "r" }
              - { name: "endTime", type: "number", access: "r" }
              - { name: "duration", type: "number", access: "r" }
        - label: "MidiClip"
          extends: "Clip"
          properties: []
        - label: "AudioClip"
          extends: "Clip"
          properties:
              - { name: "filePath", type: "string", access: "r" }
              - { name: "warping", type: "boolean", access: "rw" }
              - { name: "warpMode", type: "enum", access: "rw", enum: "warp_mode" }
        - label: "ClipSlot"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "hasClip", type: "boolean", access: "r" }
        - label: "Scene"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "rw" }
              - { name: "tempo", type: "number", access: "r" }
              - { name: "signatureNumerator", type: "number", access: "r" }
              - { name: "signatureDenominator", type: "number", access: "r" }
        - label: "Device"
          abstract: true
          description: "RackDevice / DrumRack / Simpler を含む抽象基底。"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "r" }
        - label: "RackDevice"
          extends: "Device"
          properties: []
        - label: "DrumRack"
          extends: "Device"
          properties: []
        - label: "Simpler"
          extends: "Device"
          properties: []
        - label: "Parameter"
          description: "デバイス／ミキサーのパラメータ。"
          properties:
              - { name: "name", type: "string", access: "r" }
              - { name: "value", type: "number", access: "rw" }
              - { name: "min", type: "number", access: "r" }
              - { name: "max", type: "number", access: "r" }
              - { name: "defaultValue", type: "number", access: "r" }
              - { name: "isQuantized", type: "boolean", access: "r" }
              - { name: "valueItems", type: "string[]", access: "r" }
        - label: "Chain"
          properties:
              - { name: "index", type: "number", access: "r" }
        - label: "DrumChain"
          extends: "Chain"
          properties: []
        - label: "Note"
          description: "MidiClip 内の MIDI ノート。読みは do read、書きは do SET notes または CREATE Note で扱う。"
          properties:
              - { name: "pitch", type: "number", access: "rw" }
              - { name: "startTime", type: "number", access: "rw" }
              - { name: "duration", type: "number", access: "rw" }
              - { name: "velocity", type: "number", access: "rw" }
              - { name: "muted", type: "boolean", access: "rw" }
              - { name: "probability", type: "number", access: "rw" }
              - { name: "releaseVelocity", type: "number", access: "rw" }
              - { name: "velocityDeviation", type: "number", access: "rw" }
              - { name: "selected", type: "boolean", access: "rw" }
        - label: "CuePoint"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "rw" }
              - { name: "time", type: "number", access: "r" }
        - label: "WriteEvent"
          virtual: true
          description: "do 書き込みの undo ログエントリ（読み取り専用）。create-adapter が供給。"
          properties:
              - { name: "id", type: "string", access: "r", description: "writeId" }
              - { name: "time", type: "string", access: "r" }
              - { name: "kind", type: "string", access: "r", description: "set | create | delete | copy" }
              - { name: "statement", type: "string", access: "r" }
              - { name: "undoable", type: "string", access: "r", description: "full | partial | none" }
              - { name: "status", type: "string", access: "r", description: "applied | undone" }
        - label: "RenderJob"
          virtual: true
          description: "render ジョブ状態（読み取り専用）。render/jobs.ts が供給。"
          properties:
              - { name: "id", type: "string", access: "r" }
              - { name: "status", type: "string", access: "r", description: "running | done | error | cancelled" }
              - { name: "source", type: "string", access: "r", description: "audio-track-pre-fx | main" }
              - { name: "method", type: "string", access: "r", description: "sdk-pre-fx | realtime-resampling" }
              - { name: "phase", type: "string", access: "r" }
              - { name: "audioStatus", type: "string", access: "r", description: "pending | ready | failed" }
              - { name: "cleanupStatus", type: "string", access: "r", description: "pending | complete | needs_attention" }
              - { name: "startTime", type: "number", access: "r" }
              - { name: "endTime", type: "number", access: "r" }
              - { name: "duration", type: "number", access: "r" }
              - { name: "durationSeconds", type: "number", access: "r" }
              - { name: "progressCurrentBeat", type: "number", access: "r" }
              - { name: "progressEndBeat", type: "number", access: "r" }
              - { name: "progressFraction", type: "number", access: "r" }
              - { name: "captureTrackRetained", type: "boolean", access: "r" }
              - { name: "filePath", type: "string", access: "r" }
              - { name: "error", type: "string", access: "r" }
        - label: "Transport"
          virtual: true
          description: "Transport 状態（読み取り専用）。OSC 未接続時は 0 行で、古い値を現在値として返さない。"
          properties:
              - { name: "isPlaying", type: "boolean", access: "r" }
              - { name: "currentSongTime", type: "number", access: "r" }
              - { name: "tempo", type: "number", access: "r" }
              - { name: "recordMode", type: "boolean", access: "r" }
              - { name: "loop", type: "boolean", access: "r" }
              - { name: "loopStart", type: "number", access: "r" }
              - { name: "loopLength", type: "number", access: "r" }
              - { name: "punchIn", type: "boolean", access: "r" }
              - { name: "punchOut", type: "boolean", access: "r" }
              - { name: "backToArranger", type: "boolean", access: "r" }
              - { name: "observedAt", type: "string", access: "r" }
        - label: "TakeLane"
          properties:
              - { name: "index", type: "number", access: "r" }
              - { name: "name", type: "string", access: "rw" }
    relationships:
        - { type: "HAS_TRACK", from: "Song", to: "Track", array: true }
        - { type: "HAS_RETURN", from: "Song", to: "ReturnTrack", array: true }
        - { type: "HAS_MAIN", from: "Song", to: "MainTrack", array: false }
        - { type: "HAS_SCENE", from: "Song", to: "Scene", array: true }
        - { type: "HAS_CUE", from: "Song", to: "CuePoint", array: true }
        - { type: "HAS_MIXER", from: "Track", to: "Mixer", array: false }
        - { type: "HAS_VOLUME", from: "Mixer", to: "Parameter", array: false }
        - { type: "HAS_PAN", from: "Mixer", to: "Parameter", array: false }
        - { type: "HAS_SEND", from: "Mixer", to: "Parameter", array: true }
        - { type: "HAS_DEVICE", from: "Track", to: "Device", array: true }
        - { type: "HAS_CLIPSLOT", from: "Track", to: "ClipSlot", array: true }
        - { type: "HAS_CLIP", from: "ClipSlot", to: "Clip", array: false }
        - { type: "HAS_ARRANGEMENT_CLIP", from: "Track", to: "Clip", array: true }
        - { type: "HAS_TAKELANE", from: "Track", to: "TakeLane", array: true }
        - { type: "HAS_PARAM", from: "Device", to: "Parameter", array: true }
        - { type: "HAS_CHAIN", from: "RackDevice", to: "Chain", array: true }
        - { type: "HAS_NOTE", from: "MidiClip", to: "Note", array: true }

cypher_contract:
    grammar_summary:
        read: "MATCH <pattern> [WHERE <expr>] RETURN [DISTINCT] <items> [ORDER BY <expr> [ASC|DESC], ...] [SKIP <integer>] [LIMIT <integer>]"
        write_set: "MATCH <pattern> [WHERE <expr>] SET n.prop = <value> [, n.prop2 = <value>]*"
        write_create_standalone: "CREATE (n:Label {prop: value, ...})"
        write_create_anchored: "MATCH <pattern> [WHERE <expr>] CREATE (a)-[:REL]->(n:Label {prop: value, ...})"
        write_delete: "MATCH <pattern> [WHERE <expr>] [DETACH] DELETE n"
        write_copy: "MATCH <pattern> [WHERE <expr>] COPY n"
        call: "CALL <procedure>(<literal> [, ...])。procedure は許可リストのみ、引数は文字列・数値・真偽値・null のリテラル。動的関数名・変数参照・複数文は不可。"
        pattern: "(node)-[:REL|OTHER*min..max]->(node)"
        node: "(variable?:Label? { property: scalar, ... }?)"
        write_values: "scalar, [scalars], [{key: scalar, ...}]（例: MidiClip SET notes）"
        aggregates: "count(*) / count(var) / count(var.prop) / min|max|avg|sum(var.prop)。非集計項目で暗黙グルーピング。"
        not_supported: "AS aliases, WITH, count(DISTINCT ...), RETURN after write clauses, dynamic procedure names, multiple statements"
    default_max_hops_when_omitted: 8
    default_row_limit: 500
    absolute_row_limit: 2000
    start_labels:
        source: "packages/lom-schema/src/schema.ts#startable_labels"
        allowed:
            - "Song"
            - "Track"
            - "MidiTrack"
            - "AudioTrack"
            - "ReturnTrack"
            - "MainTrack"
            - "Clip"
            - "MidiClip"
            - "AudioClip"
            - "Device"
            - "RackDevice"
            - "DrumRack"
            - "Simpler"
            - "Scene"
            - "CuePoint"
            - "WriteEvent"
            - "RenderJob"
            - "Transport"
        note: "WriteEvent / RenderJob / Transport は仮想ラベル（読み取り専用）。Note / Parameter / ClipSlot などは通常の起点にできないが relationship で辿れる。"
    read_return_contract:
        tool: "do"
        allowed:
            - "RETURN *"
            - "RETURN node_variable"
            - "RETURN node_variable.property"
            - "comma-separated combinations"
            - "RETURN DISTINCT <items>"
            - "count(*) / count(var) / count(var.prop) / min|max|avg|sum(var.prop)"
            - "ORDER BY <var.prop | aggregate> [ASC|DESC], ..."
            - "SKIP <integer> LIMIT <integer>"
            - "MATCH (e:WriteEvent) RETURN e"
            - "MATCH (j:RenderJob) RETURN j"
            - "MATCH (t:Transport) RETURN t"
        row_cap_note: "LIMIT 省略時は DEFAULT_ROW_LIMIT(500) で truncated:true。明示 LIMIT も MAX_ROW_LIMIT(2000) でクランプ。"
        aggregation_note: "集計関数と非集計項目を混在させると、非集計項目をキーに暗黙グルーピングする。純集計クエリ（グルーピングキー無し）は空マッチでも 1 行を返す（count / sum = 0、min / max / avg = null）。グルーピングありの空マッチは 0 行。MATCH で束縛されていない変数の集計は hint 付き BadRequestError。min / max は数値に加えて文字列も対象（数値同士は数値比較、それ以外は辞書順）。sum / avg は数値プロパティのみ集計する。パースエラーには対応済み文法の hint が付く。"
    write_contract:
        tool: "do"
        source: "packages/lom-schema/src/schema.ts#query_contract.write"
        target_resolution: "書き込み文の MATCH は複数ノードにマッチ可。0 件は {status:\"no_match\"}。preview:true で対象と予定差分を返す。"
        set_properties: "WRITABLE_BY_LABEL（apps/extension/src/tools/do/schemas.ts）に準拠。Song/Track/Clip/MidiClip/AudioClip/Scene/CuePoint/Parameter/Simpler/Note。"
        create_patterns:
            - "CREATE (t:MidiTrack|AudioTrack {name?})"
            - "CREATE (s:Scene {index?, name?})"
            - "CREATE (c:CuePoint {time, name?})"
            - "MATCH (t:Track) CREATE (t)-[:HAS_DEVICE]->(d:Device {name, index?})"
            - "MATCH (s:ClipSlot) CREATE (s)-[:HAS_CLIP]->(c:MidiClip {length}) | (c:AudioClip {filePath})"
            - "MATCH (t:Track) CREATE (t)-[:HAS_ARRANGEMENT_CLIP]->(c:MidiClip|AudioClip {startTime, duration, ...})"
            - "MATCH (c:MidiClip) CREATE (c)-[:HAS_NOTE]->(n:Note {pitch, startTime, duration, velocity?})"
        delete_labels:
            - "Track"
            - "Scene"
            - "Device"
            - "Clip"
            - "MidiClip"
            - "AudioClip"
            - "CuePoint"
            - "Note"
        copy_labels:
            - "Track"
            - "Scene"
            - "Device"
        undoable_levels:
            full: "スカラー SET、notes/Note、create/copy（逆=生成物削除）、多くの delete 再作成"
            partial: "sampleFile、配置プロパティ（カスタム warp/marker）、delete Device（カタログ名）"
            none: "delete Track（confirm 必須、undo 不可）"
        guards:
            preview: "全書き込みでドライラン可"
            confirm: "undoable partial/none の書き込みは confirm:true 必須。full は件数に関わらず即実行。"
            no_match: "0 件マッチはエラーではなく no_match"
    procedure_contract:
        tool: "do"
        source: "apps/extension/src/runtime/procedures.ts"
        allowed:
            - { name: "transport.play", args: "", effect: "runtime", undoable: "none", requires_confirm: true }
            - { name: "transport.stop", args: "", effect: "runtime", undoable: "none", requires_confirm: true }
            - { name: "transport.seek", args: "beats:number", effect: "runtime", undoable: "none", requires_confirm: true }
            - { name: "render.cancel", args: "jobId:string", effect: "runtime", undoable: "none", requires_confirm: true }
        guards:
            literals_only: "引数はリテラルのみ。式・変数・動的関数名・複文は拒否する。"
            preview: "preview:true は OSC 送信を含め副作用ゼロ。"
            confirm: "confirm:true 必須。confirm なしは confirm_required。"
            lock: "Main 録音中は書き込み・undo・別 render・transport.play/seek を拒否し、render.cancel と読取は許可する。"
        note: "手続き実行は tools/do/call.ts。Transport は OSC 経由、render.cancel は録音ジョブの cancel 受理。"
    render_select_contract:
        tool: "render"
        required: "MATCH で AudioTrack を単一ノード変数で RETURN（select モード）"
        example: "MATCH (t:AudioTrack {name:\"Print\"}) RETURN t"
    render_main_contract:
        tool: "render"
        required: "source:\"main\"（または \"master\"）。preview → planId + requestId + confirm:true の順。"
        flow:
            preview: '{"source":"main","startTime":0,"endTime":64,"preview":true} → status:"preview" + planId'
            execute: '{"source":"main","startTime":0,"endTime":64,"background":true,"confirm":true,"planId":"...","requestId":"..."} → status:"started"'
        note: "実時間録音のため background:false は REALTIME_REQUIRES_BACKGROUND。Set identity は songHandle。planId は TTL 付き単発トークン。"

error_models:
    type_namespace: "urn:live-connector:error"
    type_policy: "RFC 9457 の type は外部 docs URL ではなく、安定した不透明 URI として扱う。"
    response_policy:
        http: "HTTP サーバー層は RFC 9457 ProblemDetails を返す。"
        mcp: "MCP ツール失敗時は McpError を返し、HTTP の status/type/instance は含めない。"
    classes:
        - name: "AppError"
          status_source: "constructor args"
          type_source: "constructor args or about:blank"
        - name: "ConfigError"
          status: 500
          type: "urn:live-connector:error:config"
        - name: "AuthError"
          status: 401
          type: "urn:live-connector:error:unauthorized"
        - name: "BadRequestError"
          status: 400
          type: "urn:live-connector:error:bad-request"
        - name: "NotFoundError"
          status: 404
          type: "urn:live-connector:error:not-found"
        - name: "MethodNotAllowedError"
          status: 405
          type: "urn:live-connector:error:method-not-allowed"
        - name: "HybridError"
          status: "constructor args（既定 409）"
          type: "urn:live-connector:error:hybrid"
          note: "OSC・Transport・実時間レンダーの機械可読コードを持つ。code は HybridErrorCode。"
    hybrid_error_codes:
        - "TRANSPORT_BUSY"
        - "ARRANGEMENT_NOT_ACTIVE"
        - "RENDER_BUSY"
        - "REALTIME_REQUIRES_BACKGROUND"
        - "INVALID_RANGE"
        - "PLAN_STALE"
        - "PLAN_NOT_FOUND"
        - "REQUEST_ID_CONFLICT"
        - "SET_IDENTITY_MISMATCH"
        - "OSC_UNAVAILABLE"
        - "OSC_PORT_IN_USE"
        - "OSC_WRITE_UNCERTAIN"
        - "CAPTURE_ROUTING_UNAVAILABLE"
        - "ARM_CONFLICT"
        - "ARTIFACT_STORAGE_UNAVAILABLE"
        - "UNEXPECTED_RECORDING"
        - "AUDIO_ARTIFACT_INVALID"
        - "PROCEDURE_NOT_ALLOWED"
        - "CAPTURE_CANCELLED"
        - "RECORDING_LIMIT_EXCEEDED"
    normalization:
        http:
            function: "toProblemDetails"
            app_error: "AppError.toProblemDetails(instance)"
            unknown_error:
                type: "about:blank"
                title: "Internal Server Error"
                status: 500
        mcp:
            function: "toMcpError"
            app_error:
                error: "ConfigError=config / AuthError=unauthorized / BadRequestError=bad_request / NotFoundError=not_found / MethodNotAllowedError=method_not_allowed / HybridError=HybridErrorCode"
                detail: "AppError.detail or AppError.title"
                metadata: "hint / validProperties / validRelationships / validStartLabels when present"
            unknown_error:
                error: "internal_error"
                detail: "Error.message or String(error)"

examples:
    cypher:
        source: "packages/lom-schema/src/schema.ts"
        values:
            - "MATCH (t:Track) RETURN t.index, t.name, t.kind, t.mute, t.arm"
            - "MATCH (:Track {name:\"Drums\"})-[:HAS_DEVICE]->(:Device {name:\"Operator\"})-[:HAS_PARAM]->(p:Parameter {name:\"Cutoff\"}) RETURN p.value, p.min, p.max"
            - "MATCH (t:MidiTrack {mute:true})-[:HAS_CLIPSLOT]->(:ClipSlot)-[:HAS_CLIP]->(c:Clip) RETURN t.name, c.index, c.name"
            - "MATCH (c:MidiClip {index:0})-[:HAS_NOTE]->(n:Note) WHERE n.pitch >= 60 RETURN n"
            - "MATCH (c:MidiClip)-[:HAS_NOTE]->(n:Note) RETURN c.name, count(n), max(n.pitch) ORDER BY count(n) DESC"
            - "MATCH (t:Track)-[:HAS_ARRANGEMENT_CLIP]->(c:Clip) RETURN c.name, c.startTime ORDER BY c.startTime SKIP 0 LIMIT 20"

decisions:
    structure_tool_aggregation_104:
        date: "2026-07-02"
        issue: "#104"
        decision: "構造操作の個別ツール（create / delete / duplicate × scene / track / device、session clip 等）を維持し、原設計 §3C の create_object / delete_object / duplicate_object（type 引数 + 型付き args）への集約は採用しない。"
        context: "MCP-DESIGN.md の中心思想は「操作ごとのツール化は 40 個を超えるとエージェントが混乱する。表現力はツール数でなくクエリ言語＋スキーマ内省に寄せる」。PR #73 で構造操作が個別ツールとして追加され、レビュー時点の登録ツール数は 41 で閾値を超えていた（2.17.17 時点では 39。annotations.test.ts の網羅一致テストが登録数と一致を保証）。"
        rationale:
            - "zod 検証の粒度: 個別ツールは対象種別ごとの入力スキーマ（create_track の kind、create_clip の length / audioFilePath 相互排他、delete_session_clip の ClipSlot 制約等）を静的に宣言でき、MCP クライアントが tools/list のスキーマだけで正しい引数を組める。type 引数 + discriminated union でも表現はできるが、クライアントのスキーマ表示・エラー位置特定が 1 段深くなる。"
            - "annotations の粒度: #92 で destructive / idempotent 区分を実態に合わせたばかりで、自動承認判断はツール単位で機能している。delete_object へ集約すると全 type が一律 destructive になり粒度は保てるが、create_object は種別ごとに confirm ガードの要否が異なり（例: create_track は非破壊、delete 系は confirm 必須）単一ツールでは表現が濁る。"
            - "発見性: instructions（#63）と annotations により 39 ツールでの発見性劣化は緩和済み。ツール数削減効果は約 10 個で、tools/list のコンテキスト消費削減は限定的。"
            - "互換性: 集約は既存 10 ツールの削除または並行残置を要し、既存クライアント（書き込み履歴・スナップショット・batch 対象外リストの参照を含む）への破壊的変更となる。現時点で得られる便益が移行コストを下回る。"
            - "閾値との関係: 現在 39 ツールで設計閾値 40 以下。今後のツール追加で 40 を継続的に超える場合は、新規追加を集約形式で設計する（既存の個別ツールは残置）方針で再検討する。"
        revisit_when: "登録ツール数が 45 を超えたとき、または MCP クライアント側でツール一覧のコンテキスト消費が実測で問題化したとき。"
    tool_organization_132:
