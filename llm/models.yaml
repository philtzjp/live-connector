            - "候補 C の 4 ツールは annotations が CREATE_WRITE・DESTRUCTIVE・IDEMPOTENT_WRITE の 3 区分にまたがる。MCP annotations はツール単位のため統合すると destructive に寄せざるを得ず、設計原則 3（annotations の意味を保つ）と矛盾する（#104 rationale と同型の問題）。"
            - "候補 B は 39 件で `structure_tool_aggregation_104` の revisit_when（45 件超）に未到達。代替案「新規追加のみ集約形式・既存は残置」は #104 decision に記録済みのため重複定義しない。"
            - "batch の構造操作対応は `llm/ARCHITECTURE.md` 記載の同期 `withinTransaction` 制約（コールバック内で await 不可のため後続ステップが先行ステップの生成物を参照できない）が本質であり、候補 B の採否と独立の並行課題である。"
