schema_version: "1.0"
description: "live-connector の TypeScript 型、MCP ツール入出力、LOM グラフモデルの目録。実装変更時に更新する。"

source_files:
    build_scripts:
        - "VERSION"
        - "package.json"
        - "turbo.json"
        - "apps/extension/package.json"
        - "apps/extension/build.ts"
        - "apps/extension/package.ts"
        - "apps/extension/src/types/manifest.ts"
    runtime:
        - "apps/extension/src/extension.ts"
        - "apps/extension/src/deps.ts"
        - "apps/extension/src/version.ts"
        - "apps/extension/src/server/http.ts"
        - "apps/extension/src/server/mcp.ts"
        - "apps/extension/src/server/annotations.ts"
        - "apps/extension/src/runtime/runtime.ts"
        - "apps/extension/src/runtime/capabilities.ts"
        - "apps/extension/src/runtime/locks.ts"
        - "apps/extension/src/runtime/resolver.ts"
        - "apps/extension/src/runtime/procedures.ts"
        - "apps/extension/src/osc/codec.ts"
        - "apps/extension/src/osc/client.ts"
        - "apps/extension/src/osc/protocol.ts"
        - "apps/extension/src/osc/transport.ts"
        - "apps/extension/src/osc/routing.ts"
        - "apps/extension/src/types/hybrid.ts"
    tools:
        - "apps/extension/src/tools/common.ts"
        - "apps/extension/src/tools/meta.ts"
        - "apps/extension/src/tools/do.ts"
        - "apps/extension/src/tools/do/read.ts"
        - "apps/extension/src/tools/do/set.ts"
        - "apps/extension/src/tools/do/create.ts"
        - "apps/extension/src/tools/do/delete.ts"
        - "apps/extension/src/tools/do/copy.ts"
        - "apps/extension/src/tools/do/call.ts"
        - "apps/extension/src/tools/do/schemas.ts"
        - "apps/extension/src/tools/do/write-support.ts"
        - "apps/extension/src/tools/do/arrangement-edit.ts"
        - "apps/extension/src/tools/do/notes.ts"
        - "apps/extension/src/tools/do/devices.ts"
        - "apps/extension/src/tools/do/samples.ts"
        - "apps/extension/src/tools/do/structure.ts"
        - "apps/extension/src/tools/do/row-cap.ts"
        - "apps/extension/src/tools/undo.ts"
        - "apps/extension/src/tools/render.ts"
    undo:
        - "apps/extension/src/undo/types.ts"
        - "apps/extension/src/undo/log.ts"
        - "apps/extension/src/undo/restore.ts"
        - "apps/extension/src/undo/recreate.ts"
        - "apps/extension/src/undo/locate.ts"
        - "apps/extension/src/undo/identity.ts"
        - "apps/extension/src/undo/blueprint.ts"
    render:
        - "apps/extension/src/render/jobs.ts"
        - "apps/extension/src/render/plan.ts"
        - "apps/extension/src/render/resampling.ts"
        - "apps/extension/src/render/capture-state.ts"
        - "apps/extension/src/render/artifacts.ts"
        - "apps/extension/src/render/journal.ts"
    lom_adapter:
        - "apps/extension/src/lom/adapter.ts"
        - "apps/extension/src/lom/create-adapter.ts"
    packages:
        - "packages/cypher/src/ast.ts"
        - "packages/cypher/src/evaluator.ts"
        - "packages/cypher/src/parser.ts"
        - "packages/cypher/src/tokenizer.ts"
        - "packages/lom-schema/src/types.ts"
        - "packages/lom-schema/src/schema.ts"
        - "packages/env/src/index.ts"
        - "packages/error/src/index.ts"
        - "packages/log/src/index.ts"

enums:
    property_type:
        source: "packages/lom-schema/src/types.ts"
        values:
            - "number"
            - "string"
            - "boolean"
            - "number[]"
            - "string[]"
            - "enum"
    property_access:
        source: "packages/lom-schema/src/types.ts"
        values:
            - "r"
            - "rw"
    comparison_operator:
        source: "packages/cypher/src/ast.ts"
        values:
            - "="
            - "<>"
            - "<"
            - ">"
            - "<="
            - ">="
            - "CONTAINS"
            - "STARTS_WITH"
            - "IN"
    token_type:
        source: "packages/cypher/src/tokenizer.ts"
        values:
            - "keyword"
            - "identifier"
            - "number"
            - "string"
            - "boolean"
            - "null"
            - "punct"
    log_level:
        source: "packages/log/src/index.ts"
        values:
            - "debug"
            - "info"
            - "warn"
            - "error"
    warp_mode:
        source: "packages/lom-schema/src/schema.ts"
        values:
            - "Beats"
            - "Tones"
            - "Texture"
            - "Repitch"
            - "Complex"
            - "ComplexPro"
    grid_quantization:
        source: "packages/lom-schema/src/schema.ts"
        values:
            - "NoGrid"
            - "EightBars"
            - "FourBars"
            - "TwoBars"
            - "Bar"
            - "Half"
            - "Quarter"
            - "Eighth"
            - "Sixteenth"
            - "ThirtySecond"

models:
    - name: "ExtensionManifest"
      kind: "manifest"
      source: "apps/extension/src/types/manifest.ts"
      owner_package: "@live-connector/extension"
      fields:
          - name: "name"
            type: "string"
            required: true
          - name: "author"
            type: "string"
            required: true
          - name: "version"
            type: "string"
            required: true
            value: "3.0.0"
            note: "バージョンの正本は VERSION。build.ts が manifest.json / package.json と一致を検証し、__LIVE_CONNECTOR_VERSION__ としてバンドルへ注入する。"
          - name: "entry"
            type: "string"
            required: true
          - name: "minimumApiVersion"
            type: "string"
            required: true

    - name: "ServiceVersion"
      kind: "version"
      source: "VERSION"
      note: "配布バージョンの正本。http.ts / mcp.ts は手書きリテラルを持たず version.ts の SERVICE_VERSION（build 注入）を参照する。"
      fields:
          - name: "value"
            type: "semver"
            required: true
            value: "3.1.0"

    - name: "Env"
      kind: "configuration"
      source: "packages/env/src/index.ts"
      owner_package: "@live-connector/env"
      fields:
          - name: "LIVE_CONNECTOR_MCP_HOST"
            type: "string"
            required: false
            default: "127.0.0.1"
            note: "loopback host のみ許可する。"
          - name: "LIVE_CONNECTOR_MCP_PORT"
            type: "number"
            required: false
            default: 7799
          - name: "LIVE_CONNECTOR_OSC_ENABLED"
            type: "boolean"
            required: false
            default: false
            note: "AbletonOSC 連携。無効でも従来の SDK 機能は動く。"
          - name: "LIVE_CONNECTOR_OSC_HOST"
            type: "string"
            required: false
            default: "127.0.0.1"
            note: "loopback host のみ許可する。"
          - name: "LIVE_CONNECTOR_OSC_SEND_PORT"
            type: "number"
            required: false
            default: 11000
          - name: "LIVE_CONNECTOR_OSC_REPLY_PORT"
            type: "number"
            required: false
            default: 11001
          - name: "LIVE_CONNECTOR_OSC_TIMEOUT_MS"
            type: "number"
            required: false
            default: 1500
          - name: "LIVE_CONNECTOR_CAPTURE_VALIDATION_LEVEL"
            type: "\"unverified\" | \"integration-tested\""
            required: false
            default: "unverified"
          - name: "LIVE_CONNECTOR_CAPTURE_VALIDATION_ID"
            type: "string"
            required: false
            note: "検証済み Live/SDK/OSC revision の識別子。任意。"
          - name: "LIVE_CONNECTOR_PLAN_TTL_MS"
            type: "number"
            required: false
            default: 60000
          - name: "LIVE_CONNECTOR_MAX_CAPTURE_BEATS"
            type: "number"
            required: false
            default: 2048
          - name: "LIVE_CONNECTOR_MAX_ARTIFACT_BYTES"
            type: "number"
            required: false
            default: 536870912

    - name: "ServerDeps"
      kind: "dependency_container"
      source: "apps/extension/src/deps.ts"
      owner_package: "@live-connector/extension"
      fields:
          - name: "context"
            type: "ExtensionContext<\"1.0.0\">"
            required: true
          - name: "log"
            type: "Logger"
            required: true
          - name: "runtime"
            type: "HybridRuntime"
            required: true
            note: "activation 単位の singleton。OSC・lock・resolver を共有する。"

    - name: "ServerInfo"
      kind: "runtime_output"
      source: "apps/extension/src/server/http.ts"
      fields:
          - name: "host"
            type: "string"
            required: true
          - name: "port"
            type: "number"
            required: true
          - name: "mcpPath"
            type: "string"
            required: true
            value: "/api/v1/mcp"

    - name: "RegisteredToolsSummary"
      kind: "runtime_output"
      source: "apps/extension/src/server/mcp.ts"
      note: "describeRegisteredTools が createMcpServer と同一の register* 経路を辿って収集する。/health で公開する。"
      fields:
          - name: "count"
            type: "number"
            required: true
          - name: "digest"
            type: "string"
            required: true
            note: "ソート済みツール名の djb2 8 桁 hex ダイジェスト。"
          - name: "names"
            type: "string[]"
            required: true

    - name: "HealthResponse"
      kind: "http_response"
      source: "apps/extension/src/server/http.ts"
      content_type: "application/health+json"
      note: "認証なしエンドポイント。追加情報はバージョンとツール名の範囲に留める。"
      fields:
          - name: "status"
            type: "string"
            required: true
            value: "pass"
          - name: "version"
            type: "string"
            required: true
            value: "3.0.0"
          - name: "description"
            type: "string"
            required: true
            value: "live-connector MCP server"
          - name: "tools"
            type: "RegisteredToolsSummary"
            required: true
            note: "describeRegisteredTools(deps) の結果。稼働ホストのツール構成を外形確認する。"
          - name: "structure"
            type: "{ digest: string; songHandle: string } | null"
            required: true
            note: "接続先 Set の構造ダイジェストと songHandle。songHandle は SDK Handle.id（bigint、JSON.stringify 不可）を String 化した値。認証なしのため非 PII のみ（storageDirectory は含めない）。読み取り失敗時は null。"

    - name: "HttpEndpoint"
      kind: "http_contract"
      source: "apps/extension/src/server/http.ts"
      entries:
          - method: "GET"
            path: "/health"
            auth: "none"
            response: "HealthResponse"
          - method: "POST"
            path: "/api/v1/mcp"
            auth: "loopback Host and Origin header validation"
            transport: "StreamableHTTPServerTransport"

    - name: "TextContent"
      kind: "mcp_content"
      source: "apps/extension/src/tools/common.ts"
      fields:
          - name: "type"
            type: "\"text\""
            required: true
          - name: "text"
            type: "string"
            required: true

    - name: "ToolResult"
      kind: "mcp_result"
      source: "apps/extension/src/tools/common.ts"
      fields:
          - name: "content"
            type: "TextContent[]"
            required: true
          - name: "isError"
            type: "boolean"
            required: false

    - name: "ProblemDetails"
      kind: "error_response"
      source: "packages/error/src/index.ts"
      owner_package: "@live-connector/error"
      standard: "RFC 9457"
      fields:
          - name: "type"
            type: "string"
            required: true
          - name: "title"
            type: "string"
            required: true
          - name: "status"
            type: "number"
            required: true
          - name: "detail"
            type: "string"
            required: false
          - name: "instance"
            type: "string"
            required: false

    - name: "McpErrorMetadata"
      kind: "mcp_error_metadata"
      source: "packages/error/src/index.ts"
      owner_package: "@live-connector/error"
      fields:
          - name: "hint"
            type: "string"
            required: false
          - name: "validProperties"
            type: "string[]"
            required: false
          - name: "validRelationships"
            type: "string[]"
            required: false
          - name: "validStartLabels"
            type: "string[]"
            required: false
          - name: "validDeviceNames"
            type: "string[]"
            required: false

    - name: "McpError"
      kind: "mcp_error_response"
      source: "packages/error/src/index.ts"
      owner_package: "@live-connector/error"
      fields:
          - name: "error"
            type: "string"
            required: true
          - name: "detail"
            type: "string"
            required: true
          - name: "hint"
            type: "string"
            required: false
          - name: "validProperties"
            type: "string[]"
            required: false
          - name: "validRelationships"
            type: "string[]"
            required: false
          - name: "validStartLabels"
            type: "string[]"
            required: false
          - name: "validDeviceNames"
            type: "string[]"
            required: false

    - name: "AppErrorArgs"
      kind: "error_input"
      source: "packages/error/src/index.ts"
      fields:
          - name: "type"
            type: "string"
            required: false
          - name: "title"
            type: "string"
            required: true
          - name: "status"
            type: "number"
            required: true
          - name: "detail"
            type: "string"
            required: false
          - name: "metadata"
            type: "McpErrorMetadata"
            required: false

    - name: "Logger"
      kind: "service_interface"
      source: "packages/log/src/index.ts"
      owner_package: "@live-connector/log"
      methods:
          - name: "debug"
            params: ["message: string", "fields?: LogFields"]
          - name: "info"
            params: ["message: string", "fields?: LogFields"]
          - name: "warn"
            params: ["message: string", "fields?: LogFields"]
          - name: "error"
            params: ["message: string", "fields?: LogFields"]

    - name: "LogFields"
      kind: "record"
      source: "packages/log/src/index.ts"
      type: "Record<string, unknown>"

    - name: "ScalarValue"
      kind: "cypher_value"
      source: "packages/cypher/src/ast.ts"
      type: "string | number | boolean | null"

    - name: "Token"
      kind: "cypher_token"
      source: "packages/cypher/src/tokenizer.ts"
      fields:
          - name: "type"
            type: "TokenType"
            required: true
          - name: "value"
            type: "string"
            required: true
          - name: "start"
            type: "number"
            required: true

    - name: "NodePattern"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "variable"
            type: "string | null"
            required: true
          - name: "label"
            type: "string | null"
            required: true
          - name: "properties"
            type: "Record<string, ScalarValue>"
            required: true

    - name: "RelationshipPattern"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "types"
            type: "string[]"
            required: true
          - name: "minHops"
            type: "number"
            required: true
            default: 1
          - name: "maxHops"
            type: "number"
            required: true
            default: 1

    - name: "PatternPart"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "start"
            type: "NodePattern"
            required: true
          - name: "chain"
            type: "{ relationship: RelationshipPattern; node: NodePattern }[]"
            required: true

    - name: "PropertyRef"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "variable"
            type: "string"
            required: true
          - name: "property"
            type: "string"
            required: true

    - name: "ComparisonExpr"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "kind"
            type: "\"comparison\""
            required: true
          - name: "left"
            type: "PropertyRef"
            required: true
          - name: "operator"
            type: "ComparisonOperator"
            required: true
          - name: "right"
            type: "ScalarValue | ScalarValue[]"
            required: true

    - name: "LogicalExpr"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "kind"
            type: "\"logical\""
            required: true
          - name: "operator"
            type: "\"AND\" | \"OR\""
            required: true
          - name: "left"
            type: "WhereExpr"
            required: true
          - name: "right"
            type: "WhereExpr"
            required: true

    - name: "NotExpr"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "kind"
            type: "\"not\""
            required: true
          - name: "expr"
            type: "WhereExpr"
            required: true

    - name: "WhereExpr"
      kind: "cypher_ast_union"
      source: "packages/cypher/src/ast.ts"
      variants:
          - "ComparisonExpr"
          - "LogicalExpr"
          - "NotExpr"

    - name: "ReturnItem"
      kind: "cypher_ast_union"
      source: "packages/cypher/src/ast.ts"
      variants:
          - "{ kind: \"all\" }"
          - "{ kind: \"variable\"; variable: string }"
          - "{ kind: \"property\"; variable: string; property: string }"
          - "AggregateItem"

    - name: "AggregateItem"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "kind"
            type: "\"aggregate\""
            required: true
          - name: "func"
            type: "\"count\" | \"min\" | \"max\" | \"avg\" | \"sum\""
            required: true
          - name: "arg"
            type: "AggregateArg"
            required: true
          - name: "alias"
            type: "string"
            required: true
            note: "RETURN 行キー・ORDER BY 参照に使う正規化表記（count(n) 等）。"

    - name: "AggregateArg"
      kind: "cypher_ast_union"
      source: "packages/cypher/src/ast.ts"
      variants:
          - "{ kind: \"star\" }"
          - "{ kind: \"variable\"; variable: string }"
          - "{ kind: \"property\"; variable: string; property: string }"

    - name: "OrderItem"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "key"
            type: "OrderKey (variable | property | AggregateItem)"
            required: true
          - name: "direction"
            type: "\"ASC\" | \"DESC\""
            required: true

    - name: "Query"
      kind: "cypher_ast"
      source: "packages/cypher/src/ast.ts"
      fields:
          - name: "pattern"
            type: "PatternPart"
            required: true
          - name: "where"
            type: "WhereExpr | null"
            required: true
          - name: "distinct"
            type: "boolean"
            required: true
          - name: "returns"
            type: "ReturnItem[]"
            required: true
          - name: "orderBy"
            type: "OrderItem[]"
            required: true
          - name: "skip"
            type: "number | null"
            required: true
          - name: "limit"
            type: "number | null"
            required: true

    - name: "Row"
      kind: "query_result"
      source: "packages/cypher/src/evaluator.ts"
      type: "Record<string, unknown>"

    - name: "GraphAdapter"
      kind: "service_interface"
      source: "packages/cypher/src/evaluator.ts"
      methods:
          - name: "seeds"
            params: ["label: string | null"]
            returns: "Promise<N[]>"
          - name: "expand"
            params: ["node: N", "relationshipTypes: string[]"]
            returns: "Promise<N[]>"
          - name: "labelOf"
            params: ["node: N"]
            returns: "string"
          - name: "matchesLabel"
            params: ["node: N", "label: string"]
            returns: "boolean"
          - name: "getProperty"
            params: ["node: N", "property: string"]
            returns: "Promise<ScalarValue>"
          - name: "serialize"
            params: ["node: N"]
            returns: "Promise<Record<string, unknown>>"
          - name: "identity"
            params: ["node: N"]
            returns: "unknown"

    - name: "PropertyDef"
      kind: "lom_schema_type"
      source: "packages/lom-schema/src/types.ts"
      fields:
          - name: "name"
            type: "string"
            required: true
          - name: "type"
            type: "PropertyType"
            required: true
          - name: "access"
            type: "PropertyAccess"
            required: true
          - name: "enumValues"
            type: "string[]"
            required: false
          - name: "description"
            type: "string"
            required: false

    - name: "NodeLabelDef"
      kind: "lom_schema_type"
      source: "packages/lom-schema/src/types.ts"
      fields:
          - name: "label"
            type: "string"
            required: true
          - name: "extends"
            type: "string"
            required: false
          - name: "abstract"
            type: "boolean"
            required: false
          - name: "properties"
            type: "PropertyDef[]"
            required: true
          - name: "description"
            type: "string"
            required: false

    - name: "RelationshipDef"
      kind: "lom_schema_type"
      source: "packages/lom-schema/src/types.ts"
      fields:
          - name: "type"
            type: "string"
            required: true
          - name: "from"
            type: "string"
            required: true
          - name: "to"
            type: "string"
            required: true
          - name: "array"
            type: "boolean"
            required: true
          - name: "description"
            type: "string"
            required: false

    - name: "QueryContract"
      kind: "lom_schema_type"
      source: "packages/lom-schema/src/types.ts"
      fields:
          - name: "grammar"
            type: "string"
            required: true
          - name: "start_labels"
            type: "string[]"
            required: true
          - name: "time_coordinates"
            type: "{ absolute: string; relative: string }"
            required: true
            note: "アレンジメント絶対拍とクリップ相対拍の 2 系統。Note / MidiClip SET notes は相対拍。"
          - name: "read"
            type: "{ tool: string; return_contract: string; allowed_returns: string[] }"
            required: true
          - name: "select"
            type: "{ tools: string[]; return_contract: string; valid_examples: string[]; invalid_examples: string[]; hint: string }"
            required: true

    - name: "LomSchema"
      kind: "lom_schema_type"
      source: "packages/lom-schema/src/types.ts"
      fields:
          - name: "version"
            type: "string"
            required: true
          - name: "nodes"
            type: "NodeLabelDef[]"
            required: true
          - name: "relationships"
            type: "RelationshipDef[]"
            required: true

    - name: "ObjectNode"
      kind: "adapter_internal_model"
      source: "apps/extension/src/lom/adapter.ts"
      fields:
          - name: "type"
            type: "\"object\""
            required: true
          - name: "label"
            type: "string"
            required: true
          - name: "value"
            type: "DataModelObject<\"1.0.0\">"
            required: true
          - name: "index"
            type: "number | null"
            required: true

    - name: "NoteNode"
      kind: "adapter_internal_model"
      source: "apps/extension/src/lom/adapter.ts"
      fields:
          - name: "type"
            type: "\"note\""
            required: true
          - name: "label"
            type: "\"Note\""
            required: true
          - name: "value"
            type: "NoteDescription"
            required: true
          - name: "index"
            type: "number"
            required: true

    - name: "LomNode"
      kind: "adapter_internal_union"
      source: "apps/extension/src/lom/adapter.ts"
      variants:
          - "ObjectNode"
          - "NoteNode"

mcp_tools:
    - name: "McpServerMetadata"
      kind: "mcp_metadata"
      source: "apps/extension/src/server/mcp.ts"
      note: "initialize 応答の instructions（推奨手順 meta→do read→do write→do call→render→undo、時刻座標・render の 2 モード・Main 録音中の排他・ガードレール）と、withToolAnnotations facade による tool annotations。区分: meta=readOnlyHint / do=destructiveHint（読み書き統合）/ undo=destructiveHint+idempotentHint:false / render=readOnlyHint:false+destructiveHint:true+idempotentHint:false（Main 実時間録音が一時トラックと Transport を変更するため保守的）。正本は apps/extension/src/server/annotations.ts の TOOL_ANNOTATIONS（4 件）、網羅一致は annotations.test.ts で固定。"
      decisions:
          mixer_write: "volume/panning/send は HAS_MIXER→Parameter 経由で do SET Parameter.value に統一する。"
          mcp_prompts: "本 release では MCP prompts を採用しない。定型ワークフローの配布は instructions で代替する。"

    - name: "meta"
      source: "apps/extension/src/tools/meta.ts"
      description: "サービス・スキーマ・概要の入口。操作前に必ず呼ぶ。"
      input:
          includeClips:
              type: "boolean"
              required: false
              default: true
              note: "overview のトラックにアレンジメントクリップ明細を含める。"
          trackOffset:
              type: "number"
              required: false
              default: 0
              constraints: ["integer", "value >= 0"]
          trackLimit:
              type: "number"
              required: false
              constraints: ["integer", "positive"]
      output:
          content:
              type: "TextContent[]"
              text_json_shape:
                  service: "{ name, version }"
                  schema: "LomSchema"
                  query_contract: "QueryContract（読み書き文法・CALL 手続き）"
                  examples: "string[]"
                  capabilities: "RenderCapabilities（audioTrackPreFx / mainOutput）"
                  runtime: "RuntimeCapabilities（osc.connected, capturePairing, realtimeRenderLimit, maxCaptureBeats, maxArtifactBytes, validationLevel, validationId?）"
                  virtual_labels:
                      WriteEvent: "undo ログ照会クエリ"
                      RenderJob: "render ジョブ照会クエリ"
                      Transport: "Transport 状態照会クエリ（OSC 未接続は 0 行）"
                  overview: "tempo / scale / track 概要 / cuePoints / structureDigest / identity"

    - name: "do"
      source: "apps/extension/src/tools/do.ts"
      description: "Cypher サブセットで Live Set を読み書きする統合ツール。"
      note: |
          read: MATCH ... RETURN（LIMIT 省略時 500 行 truncate、明示 LIMIT は 2000 絶対上限）。
          write SET: MATCH ... SET n.prop = value（ラベル別書き込み可能プロパティは WRITABLE_BY_LABEL）。
          write CREATE: CREATE (t:MidiTrack|AudioTrack {name?}) / CREATE (s:Scene {index?, name?}) / CREATE (c:CuePoint {time, name?}) / MATCH ... CREATE (a)-[:REL]->(n:Label {...})。
          write DELETE: MATCH ... [DETACH] DELETE n。
          write COPY: MATCH ... COPY n（Track / Scene / Device）。
          call: CALL transport.play() | transport.stop() | transport.seek(<beats>) | render.cancel(<jobId>)。許可手続きとリテラル引数のみ。preview:true は OSC 送信も含め副作用ゼロ、confirm:true 必須。effect:"runtime" / undoable:"none" で WriteEvent には記録しない。Main 録音中は書き込み・undo・別 render と transport.play/seek を拒否し、render.cancel と読み取りは許可する。
          preview:true でドライラン。undoable partial/none は confirm:true 必須。
          応答: status ok|no_match|preview|confirm_required。書き込み ok は writeId + undoable + changed|created|deleted|copied（差分のみ）。
          WRITABLE_BY_LABEL: Song[tempo]; Track/MidiTrack/AudioTrack/ReturnTrack/MainTrack[name,arm,mute,solo]; Clip[name,color,muted,looping,startTime,duration,startMarker,endMarker]; MidiClip[+notes]; AudioClip[+warping,warpMode]; Scene[name]; CuePoint[name]; Parameter[value]; Simpler[sampleFile]; Note[pitch,startTime,duration,velocity,muted,probability,releaseVelocity,velocityDeviation]。
          CREATE 対応: MidiTrack/AudioTrack; Scene; CuePoint; MATCH (t:Track) CREATE Device; MATCH (s:ClipSlot) CREATE MidiClip{length}|AudioClip{filePath}; MATCH (t:Track) CREATE arrangement MidiClip|AudioClip; MATCH (c:MidiClip) CREATE Note。
      input:
          statement:
              type: "string"
              required: true
              min_length: 1
              note: "実行する Cypher 文（読み取り・書き込み・CALL）"
          preview:
              type: "boolean"
              required: false
              note: "書き込み・CALL のドライラン（CALL preview は副作用ゼロ）"
          confirm:
              type: "boolean"
              required: false
              note: "undoable partial/none の書き込み、または CALL の確定"
      output:
          content:
              type: "TextContent[]"
              text_json_shape:
                  read_ok:
                      status: "\"ok\""
                      count: "number"
                      rows: "Row[]"
                      truncated: "boolean"
                      hint: "string | undefined"
                  write_no_match:
                      status: "\"no_match\""
                      matched: "0"
                      hint: "string"
                  write_preview:
                      status: "\"preview\""
                      matched: "number"
                      plan: "object"
                  write_confirm_required:
                      status: "\"confirm_required\""
                      undoable: "\"partial\" | \"none\""
                      undoableReason: "string | undefined"
                      plan: "object"
                  write_ok:
                      status: "\"ok\""
                      writeId: "string"
                      undoable: "\"full\" | \"partial\" | \"none\""
                      undoableReason: "string | undefined"
                      changed: "ChangedEntry[] | undefined"
                      created: "object[] | undefined"
                      deleted: "object[] | undefined"
                      copied: "object[] | undefined"

    - name: "undo"
      source: "apps/extension/src/tools/undo.ts"
      description: "do 書き込みの逆操作を LIFO で適用する。undo 自体は新しい undo エントリを作らない。"
      note: "undo ログは storageDirectory/undo/undo-log.jsonl（JSONL、MAX_UNDO_ENTRIES=200）。inverse: set_properties / notes_replace / delete_created / recreate（RecreateBlueprint）。照会は do read MATCH (e:WriteEvent) RETURN e。"
      input:
          steps:
              type: "number"
              required: false
              default: 1
              constraints: ["integer", "positive"]
              note: "戻す件数（LIFO）"
          writeId:
              type: "string"
              required: false
              note: "特定 writeId のみ戻す"
      output:
          content:
              type: "TextContent[]"
              text_json_shape:
                  no_match:
                      status: "\"no_match\""
                      hint: "string"
                  ok:
                      status: "\"ok\""
                      undone:
                          type: "array"
                          item:
                              writeId: "string"
                              kind: "\"set\" | \"create\" | \"delete\" | \"copy\""
                              restored: "number"
                              reverted: "object[]"
                              note: "string | undefined"

    - name: "render"
      source: "apps/extension/src/tools/render.ts"
      description: "AudioTrack の指定 beat 範囲を Pre-FX レンダリングする（select モード）。source:\"main\" では Main 出力を Resampling で実時間録音する（Main モード）。"
      note: |
          select モード（互換）: 従来どおり単一 AudioTrack の Pre-FX。background:true で非同期ジョブ、省略時は同期。
          main モード（新規）: preview で実行計画（planId）を取得し、planId + requestId + confirm:true で実行。実時間再生のため常に background ジョブ（background:false は REALTIME_REQUIRES_BACKGROUND）。source:"master" は "main" の別名。
          planId は短命トークン。Set identity（songHandle）・引数 hash・期限を実行直前に再検証する。requestId は冪等性キーで、同じ Set 世代・同じ引数なら既存 job を返す。
          Main 録音は一時 AudioTrack を作成し loop/punch/record_mode を変更する。終了後に復旧し、一時トラックを削除（keepCaptureTrack:true なら消音・Disarm で保持）。音声は storageDirectory/renders/<jobId>/ に確定コピーし、manifest.json と recovery.json を残す。
          Main 録音中は書き込み・undo・別 render を拒否する（読み取り・job 照会・CALL render.cancel は許可）。
          timeUnit は四分音符 beat。duration は拍、durationSeconds は実秒。
      input:
          select:
              type: "string"
              required: false
              contract: "AudioTrack を単一ノード変数で RETURN する MATCH。source と排他。"
          source:
              type: "\"main\" | \"master\""
              required: false
              note: "Main 出力の実時間録音。select と排他。master は main へ正規化。"
          startTime:
              type: "number"
              required: true
              constraints: ["finite", "value >= 0"]
          endTime:
              type: "number"
              required: true
              constraints: ["finite", "positive", "endTime > startTime"]
          background:
              type: "boolean"
              required: false
              note: "select モード: true で非同期。Main モード: 省略時も常にジョブ、false は拒否。"
          preview:
              type: "boolean"
              required: false
              note: "Main モード: 実行計画と事前検査のみ。OSC 送信・トラック作成をしない。"
          confirm:
              type: "boolean"
              required: false
              note: "Main モードの実行に必須。"
          planId:
              type: "string"
              required: false
              note: "Main モードの実行に必須。preview が返す。"
          requestId:
              type: "string"
              required: false
              note: "Main モードの実行に必須。冪等性キー。"
          keepCaptureTrack:
              type: "boolean"
              required: false
              default: false
              note: "true なら録音トラックを消音・Disarm で保持。"
          preRollBeats:
              type: "number"
              required: false
              default: 0
              constraints: ["value >= 0"]
              note: "指定時は開始前を再生する。実際の値を結果へ記録する。"
      output:
          content:
              type: "TextContent[]"
              text_json_shape:
                  sync_ok:
                      status: "\"ok\""
                      filePath: "string"
                      source: "\"audio-track-pre-fx\""
                      method: "\"sdk-pre-fx\""
                      startTime: "number"
                      endTime: "number"
                      duration: "number"
                      track: "{ index, name, kind:\"audio\" }"
                      hint: "Poll with do: MATCH (j:RenderJob {id:\"...\"}) RETURN j"
                  background_started:
                      status: "\"started\""
                      jobId: "string"
                      source: "\"audio-track-pre-fx\""
                      method: "\"sdk-pre-fx\""
                      track: "{ index, name, kind:\"audio\" }"
                      startTime: "number"
                      endTime: "number"
                      duration: "number"
                      hint: "string"
                  main_preview:
                      status: "\"preview\""
                      planId: "string"
                      source: "\"main\""
                      method: "\"realtime-resampling\""
                      timeUnit: "\"quarter-note-beats\""
                      range: "{ startTime, endTime }"
                      preRollBeats: "number"
                      keepCaptureTrack: "boolean"
                      effects: "string[]"
                      requiresConfirmation: "true"
                      limits: "{ maxCaptureBeats, maxArtifactBytes }"
                      warnings: "string[]"
                  main_confirm_required:
                      status: "\"confirm_required\""
                      source: "\"main\""
                      planId: "string"
                      requestId: "string"
                      requiresConfirmation: "true"
                  main_started:
                      status: "\"started\""
                      jobId: "string"
                      source: "\"main\""
                      method: "\"realtime-resampling\""
                      startTime: "number"
                      endTime: "number"
                      duration: "number"
                      hint: "string"

    - name: "deprecated_tools_v3"
      note: "v3.0.0 で削除。後継は llm/version/3.0.0.md の対応表を参照。"
      removed:
          - "schema / get_overview → meta"
          - "query → do read"
          - "set_* / write_notes / transform_notes / load_sample / create_* / delete_* / duplicate_* / move_clip / trim_clip / insert_device → do write"
          - "render_audio / get_render_job → render / do read RenderJob"
          - "get_write_history / list_snapshots / restore_snapshot → do read WriteEvent / undo"
          - "batch → 複数ノード MATCH SET で代替"
          - "search_presets / save_device_state / apply_device_state / verify_device_catalog → 廃止"

