    four_tool_taxonomy_v3:
        date: "2026-07-03"
        status: "adopted"
        supersedes: "tool_organization_132"
        decision: "MCP ツール表面を 4 ツール（meta / do / undo / render）へ全面統合する。39 個の操作別ツールは v3.0.0 で削除（deprecation 期間なしの破壊的変更）。"
        principles:
            - "1 Cypher 文ツール: 読み取り・書き込みは do の statement 引数に集約（SET / CREATE / DELETE / COPY 方言）。"
            - "差分応答: 書き込みは changed/created/deleted/copied の差分のみ返す。マッチ 0 件は no_match。"
            - "undo 一本化: スナップショット・書き込み履歴・batch を廃止し、inverse diff の JSONL undo ログと undo ツールに統合。"
            - "undoable 宣言と confirm: 各書き込みは undoable full/partial/none を宣言。partial/none は confirm:true 必須。"
            - "人間タクソノミー 4 動詞: meta（入口）/ do（見る・変える）/ render（聴く）/ undo（戻す）。"
        context: "v2.17.18 の tool_organization_132 は 39 → 33 件の段階的統合（set_properties + edit_notes）を計画していたが、Cypher 書き込み方言と undo ログへの集約により 4 ツールへ再設計した。"
        breaking_change: "旧ツール名は v3.0.0 から存在しない。MCP クライアントは meta → do read → do write (preview/confirm) → render → undo の推奨フローへ移行する。"
