name: タスク / Task
description: 実装・改善・リファクタリング・修正・ドキュメントの作業を起票する / File implementation, improvement, refactoring, fix or documentation work
title: "type(scope): "
body:
    - type: markdown
      attributes:
          value: |
              タイトルは `type(scope): 説明` の形式にしてください。`type` は `feat` / `fix` / `perf` / `refactor` / `docs` / `style` / `test` / `chore` / `ci` / `build` のいずれかです。`scope` は変更する場所で決めます（`apps/extension` なら `extension`、`packages/cypher` なら `cypher`、`llm/` や `.github/` などトップレベルディレクトリならそのディレクトリ名、リポジトリ全体なら `repo`）。説明は日本語の短い文で、動作で終えてください。

              Write the title as `type(scope): description`. `type` is one of `feat`, `fix`, `perf`, `refactor`, `docs`, `style`, `test`, `chore`, `ci` or `build`. `scope` comes from the place you change: `extension` for `apps/extension`, the package name such as `cypher` for anything under `packages/`, the directory name such as `llm` or `.github` for a top-level directory, and `repo` for the whole repository.

              記法の詳細は [CONTRIBUTING.md](https://github.com/philtzjp/live-connector/blob/main/CONTRIBUTING.md) にあります。 / See [CONTRIBUTING.md](https://github.com/philtzjp/live-connector/blob/main/CONTRIBUTING.md) for the full conventions.
    - type: textarea
      id: background
      attributes:
          label: 背景 / Background
          description: なぜこの作業が必要か。客観的な論点・根拠・関連する Issue や PR を 1〜3 文で書いてください。「〜と思う」のような主観的な書き方は避けてください。 / Why this work is needed, in one to three sentences. Write verifiable facts, specifications and constraints rather than opinions.
          placeholder: |
              `do` の read が 500 行で truncate されるため、トラック数の多い Set では全体を把握できない。#128 で追加した row cap の既定値に依存している。
      validations:
          required: true
    - type: textarea
      id: scope
      attributes:
          label: 作業範囲 / Scope
          description: やることを箇条書きで書いてください。 / A bullet list of what to do.
          placeholder: |
              - `do` read の row cap に明示的な上限指定を追加する
              - `meta` の契約へ追加した指定を載せる
      validations:
          required: true
    - type: textarea
      id: acceptance
      attributes:
          label: 受け入れ条件 / Acceptance criteria
          description: 完了を判断できる条件を `- [ ]` のチェックボックスで書いてください。各条件は満たされたかどうかを検証できる形にしてください。 / Conditions that decide when the work is done, as `- [ ]` checkboxes. Each one should be verifiable.
          placeholder: |
              - [ ] 上限を指定すると指定した行数まで返る
              - [ ] 上限を省略すると従来どおり 500 行で truncate される
              - [ ] 上記を検証するユニットテストが追加される
      validations:
          required: true
    - type: textarea
      id: notes
      attributes:
          label: 備考 / Notes
          description: 参考リンク、注意点、関連する Issue や PR。なければ空のままで構いません。 / Reference links, caveats, related issues or pull requests. Leave empty if there are none.
      validations:
          required: false
